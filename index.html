<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<title>Data Mining Lab</title>
<script>try{var t=localStorage.getItem('dm.theme2');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#fbfaf8;--raise:#f3f1ed;--raise2:#ebe8e3;--float:#ffffff;
  --line:rgba(28,24,18,.08);--line2:rgba(28,24,18,.15);
  --text:#4a463f;--hi:#17150f;--mute:#8b857b;--faint:#b9b3a8;
  --accent:#d98613;--accent-soft:rgba(217,134,19,.12);--accent-ink:#ffffff;--accent-hi:#c47710;
  --good:#16924a;--good-soft:rgba(22,146,74,.09);--bad:#d4412c;--bad-soft:rgba(212,65,44,.08);
  --code-bg:#f3f1ed;--code:#9a5a06;--link:#2f6fdb;--warn:#d98613;
  --shadow-float:0 1px 2px rgba(20,16,10,.06),0 8px 24px rgba(20,16,10,.10);
  --scrim:rgba(20,16,10,.28);
  --sans:Inter,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:7px;--r-float:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121110;--raise:#1b1a18;--raise2:#24221f;--float:#1f1e1b;
  --line:rgba(255,248,235,.08);--line2:rgba(255,248,235,.15);
  --text:#c9c3b8;--hi:#f7f3ec;--mute:#7f796f;--faint:#4f4a44;
  --accent:#e8a33d;--accent-soft:rgba(232,163,61,.14);--accent-ink:#1b1306;--accent-hi:#f2b65c;
  --good:#5cc77a;--good-soft:rgba(92,199,122,.09);--bad:#ef6a55;--bad-soft:rgba(239,106,85,.09);
  --code-bg:#0c0b0a;--code:#f1c983;--link:#8fb4ff;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--text);font:400 17px/1.65 var(--sans);font-optical-sizing:auto;min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r)}
::selection{background:var(--accent-soft)}
.notrans *{transition:none!important}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar (translucent material) ---------- */
#top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
#top::after{content:"";position:absolute;left:0;right:0;top:100%;height:20px;pointer-events:none;background:linear-gradient(color-mix(in srgb,var(--bg) 60%,transparent),color-mix(in srgb,var(--bg) 25%,transparent) 40%,transparent)}
#top .row1{display:flex;align-items:center;gap:14px;max-width:1080px;margin:0 auto;padding:12px max(20px,env(safe-area-inset-left)) 11px max(20px,env(safe-area-inset-right));font:500 13px/1.3 var(--sans);color:var(--mute)}
.chip{font:500 13px/1 var(--sans);color:var(--text);border:1px solid var(--line2);border-radius:var(--r);padding:7px 11px;background:var(--float);transition:transform 160ms var(--ease-out)}
.chip:active{transform:scale(.97)}
#top .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .crumb b{color:var(--hi);font-weight:600}
#top .crumb .dot{margin:0 7px;color:var(--faint)}
#top .count{white-space:nowrap;color:var(--mute)}
#top .count b{color:var(--hi);font-weight:600}
#prog{height:2px;background:var(--line);max-width:1080px;margin:0 auto;overflow:hidden}
#prog i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform 450ms var(--ease-out)}

/* ---------- number roll (NumberFlow-style) ---------- */
.roll{display:inline-flex;vertical-align:bottom;font-variant-numeric:tabular-nums}
.roll .d{display:inline-block;height:1.3em;line-height:1.3em;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.roll .c{display:flex;flex-direction:column;transition:transform 520ms var(--spring,var(--ease-out))}
.roll .c span{height:1.3em}

/* ---------- stage + step transitions ---------- */
#stage{position:relative;max-width:calc(64ch + 40px);margin:0 auto;padding:56px 20px calc(150px + env(safe-area-inset-bottom))}
.view.leaving{position:absolute;left:20px;right:20px;pointer-events:none}
.kicker{font:600 12px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.kicker .m{color:var(--mute)}
h1{font:700 clamp(30px,4.4vw,42px)/1.08 var(--sans);letter-spacing:-.03em;color:var(--hi);margin:0 0 24px}
h2{font:650 24px/1.2 var(--sans);letter-spacing:-.02em;color:var(--hi);margin:34px 0 12px}
h3{font:600 12px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:38px 0 10px}
p{margin:0 0 17px}
b,strong{color:var(--hi);font-weight:600}
.lead{font-size:18px;color:var(--text)}
.mu{color:var(--mute)}
ul,ol{margin:0 0 17px;padding-left:22px} li{margin-bottom:6px} li::marker{color:var(--mute)}
code{font:500 .84em/1 var(--mono);color:var(--code);background:var(--code-bg);border-radius:4px;padding:2px 5px}
pre.code{font:14px/1.6 var(--mono);background:var(--code-bg);border-radius:var(--r);padding:14px 16px;overflow-x:auto;color:var(--code);margin:0 0 17px}
pre.code code{padding:0;background:none}
table.t{border-collapse:collapse;width:100%;margin:8px 0 26px;font-size:15px;line-height:1.5;display:block;overflow-x:auto}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:10px 16px 10px 0;text-align:left;vertical-align:top}
table.t th{font:600 11px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-bottom-color:var(--line2)}
table.t td:first-child{color:var(--hi);font-weight:500}
.exam,.tip,.warn{margin:26px 0 28px;padding:14px 18px;background:var(--accent-soft);border-radius:var(--r);font-size:16px;line-height:1.6}
.exam>b:first-child,.tip>b:first-child,.warn>b:first-child{display:block;font:600 11px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.warn{background:var(--bad-soft)} .warn>b:first-child{color:var(--bad)}
.tip{background:color-mix(in srgb,var(--link) 9%,transparent)} .tip>b:first-child{color:var(--link)}
.mono{font-family:var(--mono);font-size:14px} .okc{color:var(--good)} .noc{color:var(--bad)}

/* ---------- question ---------- */
.qnum{font:600 12px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:14px;font-variant-numeric:tabular-nums}
.qnum .real{color:var(--accent);margin-left:10px}
.qtext{font:650 23px/1.38 var(--sans);letter-spacing:-.018em;color:var(--hi);margin-bottom:24px}
.qtext p{margin:0 0 10px} .qtext code{font-size:.72em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line2);border-radius:var(--r);background:var(--float);font-size:17px;line-height:1.45;color:var(--text);transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease}
.opt .k{flex:none;display:grid;place-items:center;width:24px;height:24px;margin-top:-1px;border-radius:5px;border:1px solid var(--line2);font:600 12px/1 var(--mono);color:var(--mute);transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.opt .ic{margin-left:auto;flex:none;width:20px;height:20px;margin-top:1px}
.opt:active:not([disabled]){transform:scale(.985)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft);color:var(--hi)} .opt.pick .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.good{border-color:var(--good);background:var(--good-soft);color:var(--hi)} .opt.good .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
svg.draw path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 360ms cubic-bezier(.645,.045,.355,1) forwards}
svg.draw path+path{animation-delay:120ms}
@keyframes draw{to{stroke-dashoffset:0}}
.opt.good svg path{stroke:var(--good)} .opt.bad svg path{stroke:var(--bad)}
.fbwrap{overflow:hidden;transition:height 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.fb{margin-top:16px;padding:14px 18px;border-radius:var(--r);background:var(--raise);font-size:16px;line-height:1.6}
.fb .v{display:block;font:600 12px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.fb.ok{background:var(--good-soft)} .fb.ok .v{color:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no .v{color:var(--bad)}
.fb.info{background:var(--accent-soft)} .fb.info .v{color:var(--accent)}
input.ans,textarea.ans{width:100%;background:var(--float);border:1px solid var(--line2);border-radius:var(--r);padding:13px 15px;font:500 17px/1.4 var(--mono);color:var(--hi);transition:border-color 150ms ease,box-shadow 150ms ease}
textarea.ans{font:400 16px/1.65 var(--sans);min-height:240px;resize:vertical}
input.ans:focus,textarea.ans:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.ans::placeholder,textarea.ans::placeholder{color:var(--faint)}
input.ans.shake{animation:shake 320ms var(--ease-out)}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}

/* ---------- buttons ---------- */
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;align-items:center}
.btn{position:relative;font:600 14px/1 var(--sans);padding:11px 16px;border:1px solid var(--line2);border-radius:var(--r);background:var(--float);color:var(--hi);transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--hi);border-color:var(--hi);color:var(--bg)}
.btn.sm{font-size:13px;padding:7px 11px}
.keys{font:500 13px/1.4 var(--sans);color:var(--mute)}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:3px 5px;margin:0 2px;color:var(--text);background:var(--float);display:inline-block}
.hold .ov{position:absolute;inset:-1px;display:flex;align-items:center;padding:0 16px;background:var(--bad);color:#fff;clip-path:inset(0 100% 0 0);transition:clip-path 200ms var(--ease-out)}
.hold.holding .ov{clip-path:inset(0 0 0 0);transition:clip-path 2s linear}
@media (hover:hover) and (pointer:fine){
  .opt:hover:not([disabled]):not(.pick){border-color:var(--mute)}
  .opt:hover:not([disabled]) .k{color:var(--hi)}
  .btn:hover{border-color:var(--mute)}
  .btn.pri:hover{opacity:.88}
  .chip:hover{border-color:var(--mute);color:var(--hi)}
  .li:hover{background:var(--raise)}
  details.sol summary:hover{color:var(--hi)}
}

/* ---------- segmented control: clip-path indicator ---------- */
.seg{position:relative;display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);background:var(--float);padding:3px}
.seg .row{display:flex}
.seg button{font:600 14px/1 var(--sans);padding:9px 14px;border-radius:5px;color:var(--text);white-space:nowrap}
.seg .on{position:absolute;inset:3px;pointer-events:none;transition:clip-path 250ms var(--ease-in-out)}
.seg .on .row button{background:var(--hi);color:var(--bg)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;margin:16px 0 4px}
.switch .tr{position:relative;width:36px;height:20px;border-radius:20px;background:var(--raise2);border:1px solid var(--line2);transition:background-color 150ms ease}
.switch .tr i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--float);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform 220ms var(--ease-out)}
.switch.on .tr{background:var(--accent);border-color:var(--accent)} .switch.on .tr i{transform:translateX(16px)}

/* ---------- footer ---------- */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 70%,transparent) 35%,var(--bg) 75%);padding:34px max(20px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
#foot .in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
#foot .in>*{pointer-events:auto}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:2px;margin:6px 0 28px}
.li{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 12px;border-radius:var(--r);color:var(--text);transition:transform 160ms var(--ease-out),background-color 150ms ease}
.li:active{transform:scale(.99)}
.li .n{font:600 12px/1 var(--mono);color:var(--accent)}
.li .t{font:600 16px/1.3 var(--sans);letter-spacing:-.01em;color:var(--hi)}
.li .d{display:block;font-size:13px;color:var(--mute);margin-top:3px;line-height:1.45;font-weight:400;letter-spacing:0}
.li .p{font:500 13px/1 var(--sans);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.li .p.full{color:var(--good)}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line2)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 500ms var(--ease-out)}
.li .pr{display:flex;align-items:center;gap:8px}
.big{font:700 80px/1 var(--sans);letter-spacing:-.05em;color:var(--hi);margin:6px 0 12px}
.big small{font:500 22px/1 var(--sans);letter-spacing:-.01em;color:var(--mute)}

/* rare moments: choreographed, non-uniform */
.chor .c-lead{animation:riseL 520ms var(--ease-out) both}
.chor .c-sup{animation:riseS 420ms var(--ease-out) both;animation-delay:70ms}
.chor .c-sup2{animation:riseS 420ms var(--ease-out) both;animation-delay:110ms}
.chor .c-dec{animation:fadeD 300ms ease both;animation-delay:150ms}
@keyframes riseL{from{opacity:0;transform:translateY(16px);filter:blur(3px)}}
@keyframes riseS{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeD{from{opacity:0}}

/* ---------- drawer (Vaul-style) ---------- */
#drawer{position:fixed;inset:0;z-index:40;visibility:hidden;pointer-events:none}
#drawer .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 400ms var(--ease-drawer)}
#drawer .sheet{position:absolute;top:8px;right:8px;bottom:8px;width:min(520px,calc(100% - 16px));background:var(--float);border:1px solid var(--line);border-radius:var(--r-float);box-shadow:var(--shadow-float);display:flex;flex-direction:column;transform:translateX(calc(100% + 16px));transition:transform 500ms var(--ease-drawer)}
#drawer .grab{flex:none;display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;cursor:grab;touch-action:none}
#drawer .grab .handle{display:none}
#drawer .body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
#drawer .body h1{font-size:28px;margin:4px 8px 12px}
#drawer .body h3{margin-left:12px}
#drawer.on{visibility:visible;pointer-events:auto}
#drawer.on .scrim{opacity:1}
#drawer.on .sheet{transform:none}
#drawer.closing{visibility:visible}
#drawer.closing .sheet{transition-duration:280ms}
#drawer.closing .scrim{transition-duration:220ms}
#drawer.dragging .sheet{transition:none}
#drawer.instant .sheet,#drawer.instant .scrim{transition-duration:0ms}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;visibility:hidden;pointer-events:none}
#modal .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 250ms var(--ease-out)}
#modal .dlg{position:relative;width:min(420px,100%);background:var(--float);border:1px solid var(--line);border-radius:var(--r-float);box-shadow:var(--shadow-float);padding:22px;opacity:0;transform:scale(.96);transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out)}
#modal .dlg h2{margin:0 0 8px;font-size:20px}
#modal .dlg p{font-size:15px;color:var(--text)}
#modal.on{visibility:visible;pointer-events:auto}
#modal.on .scrim{opacity:1} #modal.on .dlg{opacity:1;transform:none}
#modal.closing{visibility:visible} #modal.closing .dlg,#modal.closing .scrim{transition-duration:150ms}

/* ---------- toasts (Sonner-style) ---------- */
#toaster{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:60;width:min(356px,calc(100% - 32px));transform:translateX(-50%);list-style:none;margin:0;padding:0;pointer-events:none}
#toaster::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:var(--gap-fill,0px)}
.toast{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:flex-start;padding:13px 15px;background:var(--float);border:1px solid var(--line);border-radius:var(--r-float);box-shadow:var(--shadow-float);font-size:14px;line-height:1.45;color:var(--hi);pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;
  transform:var(--y) scale(var(--s));opacity:var(--o);transition:transform 400ms ease,opacity 400ms ease;transform-origin:center bottom}
.toast[data-mounted="false"]{--y:translateY(100%);--o:0}
.toast[data-removed="true"]{--y:translateY(calc(100% + 30px));--o:0}
.toast .ti{flex:none;width:18px;height:18px;margin-top:1px}
.toast .tx b{display:block;font-weight:600}
.toast .tx span{color:var(--mute)}
.toast.ok .ti path{stroke:var(--good)} .toast.err .ti path{stroke:var(--bad)} .toast.info .ti path{stroke:var(--accent)}
.toast .ti path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast.swiping{transition:none}

/* ---------- exam ---------- */
.timer{font:600 14px/1 var(--mono);color:var(--hi)}
.timer.low{color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:32px}
.dots button{width:32px;height:32px;border-radius:6px;font:500 12px/1 var(--mono);border:1px solid var(--line2);background:var(--float);color:var(--mute);transition:transform 120ms var(--ease-out)}
.dots button:active{transform:scale(.94)}
.dots button.a{color:var(--hi);background:var(--raise2)}
.dots button.c{border-color:var(--hi);color:var(--hi)}
.dots button.g{border-color:var(--good);color:var(--good)}
.rv{border-bottom:1px solid var(--line);padding:16px 0}
.rv .q{color:var(--hi);font-weight:600;margin-bottom:6px}
.rv .a{font-size:14px} .rv .a .y{color:var(--bad)} .rv .a .c{color:var(--good)}
.rv .e{font-size:15px;margin-top:6px}

/* ---------- open questions ---------- */
ul.checks{list-style:none;padding:0;margin:12px 0;font-size:15px}
ul.checks li{display:flex;gap:10px;padding:3px 0}
ul.checks .ok{color:var(--good);font-weight:700} ul.checks .no{color:var(--bad);font-weight:700}
details.sol{margin-top:22px;border-top:1px solid var(--line)}
details.sol summary{cursor:pointer;font:600 14px/1 var(--sans);color:var(--mute);padding:16px 0}
details.sol .body{font-size:16px}

/* ---------- demos ---------- */
.demo{margin:18px 0;font-size:15px}
.demo canvas{max-width:100%;border-radius:var(--r)}
.row.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:12px 0}
label.sl{display:flex;align-items:center;gap:8px;font:13px/1 var(--mono);color:var(--mute)}
label.sl b{color:var(--hi);min-width:34px;font-weight:600;font-variant-numeric:tabular-nums}
label.sl input{accent-color:var(--accent)}

  --good:#5be08a;--good-soft:rgba(91,224,138,.14);--bad:#ff7a66;--bad-soft:rgba(255,122,102,.14);
  --code-bg:rgba(0,0,0,.28);--code:#ffd590;--link:#9cc2ff;

}

<p><b>PCA</b> = veriyi daha düşük boyutlu lineer uzaya dik (orthogonal) izdüşürür; izdüşen verinin <b>variance'ını maksimize</b> eder (= izdüşüm mesafesinin karesini minimize). PC1 en büyük variance yönü; sonrakiler öncekine dik ve kalan en büyük variance.</p>

4 keep first k eigenvectors Q →  X̂ = X·Q   (each PC = linear combination of features)</code></pre>
<p>Küçük eigenvalue'ları atınca az bilgi kaybedersin. Kullanım: görselleştirme (MNIST 2D), sıkıştırma, noise, clustering öncesi. Uyarılar (L8): yeni veri için yine bütün orijinal feature'lar gerekir; yeni feature'ların birimi (metre, kg) kalmaz. Lineer = PCA (LDA), non-linear = <b>t-SNE</b>.</p>

<p>Image'deki bir doğru y = mx + b → Hough uzayında tek nokta (m, b). Image'deki bir nokta → Hough uzayında bir doğru. Aynı doğru üstündeki noktaların Hough doğruları tek (m, b)'de kesişir. Sorun: dikey doğruda m sonsuz → <b>polar</b>: <b>ρ = x cosθ + y sinθ</b>, θ ∈ [0, π]; her nokta bir sinüzoid olur.</p>

    Q('m7', 'R', C1, 'Why is K-means sensitive to initial centroid placement?', ['It can converge to a local minimum depending on the initial centroids', 'It always finds the global optimum', 'It is not affected by initial placement'], 0, 'Different starts → different results.'),
    Q('m7', 'R', C2, 'What is the correct sequence of steps in the K-means clustering algorithm?', ['Update Centroids → Assignment → Initialization → Iteration until convergence', 'Assignment → Initialization → Update Centroids → Iteration until convergence', 'Initialization → Update Centroids → Assignment → Iteration until convergence', 'Initialization → Assignment → Update Centroids → Iteration until convergence'], 3, 'Init, Assign, Update, Repeat.'),
    Q('m7', 'R', C1, 'What is a limitation of K-means when clusters differ in shape or density?', ['It may misclassify points and not find correct clusters', 'It works perfectly for all cluster shapes', 'It requires labeled data'], 0, 'Assumes round, similar clusters.'),

    Q('m9', 'R', C1, 'What is the typical order of layers in a CNN?', ['Convolution - Activation - Pooling', 'Pooling - Convolution - Activation', 'Activation - Pooling - Convolution', 'Activation - Convolution - Pooling'], 0, 'Conv → ReLU → Pool, then FC.'),
    Q('m9', 'R', C2 + ' · ' + C3, 'In a CNN, what do the deeper layers typically learn compared to earlier layers?', ['Deeper layers learn simpler features than earlier layers', 'All layers learn the same types of features', 'Deeper layers learn complex objects and shapes, while earlier layers detect edges and simple patterns'], 2, 'Edges → textures → parts → objects.'),

  function O(real, src, pts, title, q, keys, model, flag, tip) { return { real: real, src: src, pts: pts, title: title, q: q, keys: keys, model: model, flag: flag || '', tip: tip || '' }; }

  DM.OPENQ = [
    O(true, C1, 3, 'Supervised vs unsupervised', 'Explain the difference between supervised and unsupervised learning, and provide an example of each.',
      [['labeled data (supervised)', ['label']], ['unlabeled / no labels (unsupervised)', ['unlabel', 'no label', 'without label']], ['predict an output / mapping x → y', ['predict', 'mapping', 'output']], ['classification or regression', ['classif', 'regress']], ['clustering or dimensionality reduction', ['cluster', 'dimensional', 'pca']], ['a supervised example (spam, price…)', ['spam', 'price', 'diagnos', 'email']], ['an unsupervised example (customer segmentation…)', ['segment', 'customer', 'group']]],
      '<p><b>Supervised learning</b> trains on <b>labeled</b> data: every input x comes with the correct output y. The model learns the mapping x → y and predicts y for new data. Tasks: <b>classification</b> and <b>regression</b>. Example: spam filtering trained on emails labeled spam / not spam.</p><p><b>Unsupervised learning</b> uses <b>unlabeled</b> data and finds structure by itself: <b>clustering</b>, <b>dimensionality reduction</b>. Example: customer segmentation with K-means.</p><p>Supervised predicts a known target; unsupervised discovers unknown patterns. (Semi-supervised mixes a few labels with many unlabeled points.)</p>'),
    O(true, C1, 3, 'Dropout', 'Describe the dropout technique and its impact on neural network training.',
      [['regularization technique', ['regulari']], ['randomly deactivates / drops neurons', ['random']], ['during training, each iteration', ['training', 'iteration']], ['all neurons active at test, weights scaled', ['test', 'inference', 'scal', 'halv']], ['reduces overfitting', ['overfit']], ['improves generalization / robust features', ['generali', 'robust']], ['cost: slower training / rate p to tune', ['slow', 'dropout rate', 'underfit', 'tun', 'probability']]],
      '<p>Dropout is a <b>regularization</b> technique (Srivastava et al. 2014). At every training iteration each hidden neuron is <b>randomly switched off</b> with probability p (often 0.2-0.5; the slides delete half). It changes the network, not the cost function.</p><p>At <b>test time</b> all neurons are active and their outgoing weights are scaled (halved for p = 0.5).</p><p><b>Impact:</b> neurons cannot rely on specific partners, so they learn robust features; it is like training many networks and averaging them. Result: <b>less overfitting, better generalization</b>. Cost: slower convergence and p must be tuned (too high → underfitting). Usually used on fully connected layers.</p>'),
    O(true, C1, 3, 'Hough transform', 'What is the Hough Transform, and what are the steps involved in using it to detect shapes (such as lines or circles) in images?',
      [['detects shapes with an equation (lines, circles)', ['line', 'circle']], ['edge detection first (Canny)', ['edge', 'canny']], ['parameter space', ['parameter']], ['voting', ['vote', 'voting']], ['accumulator / bins', ['accumulator', 'bin']], ['peaks = detected shapes', ['peak', 'most vote', 'maximum']], ['polar ρ = x cosθ + y sinθ or circle (a, b, r)', ['rho', 'ρ', 'theta', 'θ', 'polar', 'radius']], ['robust to noise / occlusion', ['robust', 'noise', 'occlu']]],
      '<p>The Hough transform detects shapes that have an equation by mapping image points to a <b>parameter space</b> and <b>voting</b>.</p><p>1. <b>Edge detection</b> (Canny): keep strong edge points. 2. <b>Discretize</b> the parameter space into bins (<b>accumulator</b>); for lines use polar <b>ρ = x cosθ + y sinθ</b>, since the slope m is unbounded for vertical lines. 3. <b>Vote</b>: every edge point votes for all shapes passing through it (a sinusoid in (ρ, θ)). 4. <b>Peaks</b> in the accumulator = detected lines. Circles: (x−a)² + (y−b)² = r² → 3D space (a, b, r).</p><p>Pros: robust to noise and outliers, handles occlusion, finds several shapes. Cons: bin size tradeoff, grid grows exponentially with the number of parameters.</p>'),
    O(true, C1, 3, 'Data augmentation', 'What is data augmentation, what is its purpose in machine learning, and what are some common techniques used to implement it?',
      [['creates modified / new samples from existing data', ['modif', 'transform', 'artificial', 'new sample', 'new data']], ['increases dataset size and diversity', ['size', 'divers', 'increase', 'enlarge']], ['reduces overfitting', ['overfit']], ['better generalization / robustness', ['generali', 'robust']], ['flip / mirroring', ['flip', 'mirror']], ['rotation', ['rotat']], ['cropping / scaling / translation', ['crop', 'scal', 'translat']], ['color shift / noise', ['colo', 'noise', 'bright']]],
      '<p><b>What:</b> enlarging the training set with new artificial samples made by transforming existing ones (same label).</p><p><b>Purpose:</b> increase the <b>size and diversity</b> of the training set, the best defence against <b>overfitting</b>; better generalization and robustness; useful when labels are expensive.</p><p><b>Image techniques (L6-2):</b> mirroring, translation, rotation, scaling, skewing, random cropping, color shifting (ΔR, ΔG, ΔB), random noise; combined they can multiply the set ~1000×. Speech: background noise, speed change. Signals: shift, scaling, noise.</p>'),
    O(true, C1, 3, 'Elbow method', 'Describe the elbow method for determining the optimal number of clusters in K-means.',
      [['run K-means for a range of k', ['range', 'different', 'each k', 'k = 1', 'k=1', 'values of k']], ['compute SSD / inertia / within-cluster sum of squares', ['ssd', 'inertia', 'sum of squared', 'within']], ['plot k vs SSD', ['plot', 'graph', 'curve']], ['SSD decreases as k increases', ['decreas']], ['choose the bend / elbow point', ['elbow', 'bend']], ['diminishing returns after the elbow', ['slow', 'diminish', 'small improvement']]],
      '<p>Run K-means for a range of k (e.g. 1-10). For each k compute the <b>SSD / inertia</b>: the sum of squared distances of every point to its centroid. Plot k against SSD. SSD always decreases as k grows, but after the right k the improvement suddenly slows down (diminishing returns): that bend is the <b>elbow</b>, the chosen k. Slide example: 873.0 (k=1) → 173.1 (k=2) → 133.6 (k=3) → elbow at k = 2. Too small k = high SSD (poor fit); too large k = overfitting with tiny clusters. Check with the silhouette (highest) and Davies-Bouldin (lowest).</p>'),
    O(true, C1, 3, 'Convolutional layer', 'Explain how a convolutional layer processes an input image in a CNN.',
      [['filter / kernel', ['filter', 'kernel']], ['slides over the image (stride)', ['slid', 'stride', 'move']], ['dot product with local patch', ['dot product', 'multipl', 'sum']], ['feature map / activation map', ['feature map', 'activation map']], ['many filters → stacked maps (depth)', ['multiple filter', 'many filter', 'each filter', 'stack', 'depth']], ['ReLU / activation', ['relu', 'activation', 'non-linear', 'nonlinear']], ['weight sharing / fewer parameters / keeps spatial structure', ['shar', 'fewer param', 'spatial']]],
      '<p>1. A small learned <b>filter (kernel)</b>, e.g. 5×5×3, <b>slides</b> over the image with a stride. 2. At each position it computes a <b>dot product</b> with the image patch + bias → one number. 3. All positions form a 2D <b>feature map</b> showing where the pattern (e.g. a vertical edge) appears. 4. Many filters → many maps stacked as depth: 32×32×3 with six 5×5 filters, stride 1 → <b>28×28×6</b>; size = (N + 2P − F)/S + 1. 5. <b>ReLU</b> is applied element-wise; padding handles borders.</p><p>Local connectivity and <b>weight sharing</b> → far fewer parameters than a fully connected layer, and spatial structure is kept.</p>'),
    O(true, C1, 3, 'Two regularizations for regression', 'Name and describe two regularization techniques used to prevent overfitting in regression models.',
      [['L1 / Lasso', ['l1', 'lasso']], ['absolute value penalty', ['absolute', '\\|w']], ['L1 sets some weights to zero (sparsity / feature selection)', ['zero', 'sparse', 'feature selection']], ['L2 / Ridge', ['l2', 'ridge']], ['squared penalty', ['squar', 'w²', 'w\\^2']], ['L2 shrinks weights (not to zero), good with correlated features', ['shrink', 'small', 'correlat']], ['λ controls strength / bias-variance', ['lambda', 'λ', 'strength', 'variance']]],
      '<p><b>L1 / Lasso:</b> adds λΣ|w| to the loss. Pushes some coefficients <b>exactly to zero</b> → sparse, interpretable model, automatic feature selection.</p><p><b>L2 / Ridge:</b> adds λΣw². <b>Shrinks</b> all coefficients but rarely to zero; good with highly correlated features.</p><p>Both trade a little bias for lower variance; larger λ = stronger penalty (too large → underfit). Elastic Net combines both.</p>'),
    O(true, C1, 3, 'K-means steps + limitations', 'Outline the steps of the K-means algorithm and mention two of its main limitations.',
      [['initialize k centroids', ['initiali']], ['assign each point to nearest centroid', ['assign', 'nearest']], ['update centroid as the mean', ['update', 'mean']], ['repeat until convergence', ['repeat', 'iterat', 'converge']], ['limitation: sensitive to initial centroids / local minimum', ['initial', 'local']], ['limitation: outliers', ['outlier']], ['limitation: shapes / sizes / densities, or k in advance', ['spher', 'shape', 'densit', 'size', 'advance']]],
      '<p><b>Steps:</b> 1 <b>Initialization</b>: choose k and k initial centroids (often random points). 2 <b>Assignment</b>: each point to its nearest centroid (Euclidean). 3 <b>Update</b>: each centroid = mean of its points. 4 <b>Repeat</b> 2-3 until centroids stop changing. O(t·k·n), efficient on large data.</p><p><b>Limitations:</b> (1) sensitive to <b>initial centroids</b>, can stop in a local optimum → several runs; (2) sensitive to <b>outliers</b> (means + squared distances; fix: k-medoids); (3) assumes <b>spherical, equal-size, equal-density</b> clusters; (4) k must be chosen in advance.</p>'),
    O(true, C2, 4, 'Bias-variance tradeoff', 'Explain the bias-variance tradeoff in machine learning. Define bias and variance, describe how they contribute to generalization error, and discuss practical strategies to address both underfitting and overfitting.',
      [['bias = error from too simple model / wrong assumptions', ['bias']], ['variance = sensitivity to training data', ['variance', 'sensitiv']], ['high bias → underfitting', ['underfit']], ['high variance → overfitting', ['overfit']], ['generalization error / unseen data', ['generali', 'unseen', 'test error']], ['tradeoff / model complexity / balance', ['complex', 'balance', 'trade']], ['fix overfitting: regularization / more data / simpler model', ['regulari', 'more data', 'simpler', 'dropout']], ['fix underfitting: more complex model / features', ['complex model', 'more complex', 'feature']]],
      '<p><b>Bias</b> = error from too simple or wrong assumptions → <b>underfitting</b> (high train and test error). <b>Variance</b> = how much the model changes with a different training sample → <b>overfitting</b> (low train, high test error). Generalization error = bias + variance + irreducible noise. Simple models: high bias / low variance; complex: low bias / high variance. The tradeoff = pick the complexity with minimum validation error.</p><p>Against underfitting: more complex model, better features. Against overfitting: more data, augmentation, simpler model, regularization (L1, L2, dropout, early stopping), and cross-validation to detect it.</p>'),
    O(true, C2 + ' · ' + C3, 4, 'KNN principle', 'Describe the basic working principle of the k-Nearest Neighbors (KNN) algorithm.',
      [['supervised, instance-based', ['supervised', 'instance', 'non-parametric', 'lazy']], ['no training phase, stores the data', ['no training', 'store', 'not train']], ['choose k = number of neighbours', ['neighbo']], ['compute distance to all training points', ['distance']], ['Euclidean', ['euclid']], ['majority vote (classification)', ['vote', 'majority']], ['average (regression)', ['average', 'mean']], ['needs scaling / slow prediction', ['scal', 'slow', 'normaliz']]],
      '<p>KNN is a <b>supervised, non-parametric, instance-based</b> algorithm for classification and regression. It has <b>no training phase</b>: it stores the training set.</p><p>Prediction: 1. choose k; 2. compute the <b>distance</b> (usually <b>Euclidean</b>) from the new point to every training point; 3. take the k nearest; 4. classification → <b>majority vote</b>, regression → <b>average</b>. Example: k = 5, three neighbours A and two B → A.</p><p>Pros: simple, no assumptions. Cons: slow prediction on large data, needs <b>feature scaling</b>, sensitive to noise for small k.</p>',
      'The scanned answer described k-fold cross-validation (split into k parts, rotate the test part). That is a different algorithm.'),
    O(true, C2, 3, 'Transfer learning', 'Explain the concept of transfer learning and provide an example of its application.',
      [['reuse a model trained on another task', ['pre-train', 'pretrain', 'reuse', 'another task', 'trained on']], ['related task', ['related', 'new task', 'target']], ['freeze early layers / retrain last layers', ['freez', 'last layer', 'final layer']], ['fine-tuning updates weights', ['fine-tun', 'fine tun']], ['less data and training time', ['less data', 'time', 'small dataset', 'limited']], ['example: ImageNet CNN → medical images', ['imagenet', 'x-ray', 'mri', 'medical', 'vgg', 'resnet']]],
      '<p>Transfer learning reuses a model trained on a large task as the starting point for a related task. Take a CNN trained on <b>ImageNet</b> (~14M images), <b>freeze</b> its early layers (generic edges, textures), replace and train the last layers on your classes; with more data <b>fine-tune</b> more layers (update their weights with a small learning rate). Benefit: much less training time and labeled data. Example: VGG16 / ResNet pre-trained on ImageNet, fine-tuned to classify X-rays or MRI.</p>'),
    O(true, C2, 4, 'NN training process', 'Explain the neural network training process, focusing on the forward pass, backpropagation, and gradient descent optimization.',
      [['random initialization', ['initiali', 'random']], ['forward pass: weighted sum + activation', ['forward', 'weighted sum', 'activation']], ['loss function (MSE / cross-entropy)', ['loss', 'cost']], ['backpropagation: error backward', ['backprop', 'backward']], ['chain rule / gradients', ['chain rule', 'gradient', 'derivative']], ['update w ← w − α·gradient', ['update', 'learning rate', 'α', 'alpha']], ['epochs / iterate', ['epoch', 'iterat', 'repeat']], ['optimizers or problems (SGD, Adam, vanishing…)', ['sgd', 'adam', 'momentum', 'vanish', 'explod']]],
      '<p>0. <b>Initialize</b> weights randomly. 1. <b>Forward pass</b>: each layer computes z = Σwx + b and h = f(z) up to the output; the <b>loss</b> (MSE or cross-entropy) compares prediction and target. 2. <b>Backpropagation</b>: the error is propagated backward; the <b>chain rule</b> gives ∂Loss/∂w for every weight, output layer first. 3. <b>Gradient descent</b>: w ← w − α·∂Loss/∂w (SGD/mini-batch, momentum, Adam/RMSprop). 4. Repeat for many <b>epochs</b>. Problems: vanishing gradients (ReLU), exploding gradients (clipping), overfitting (dropout, early stopping).</p>'),
    O(true, C2, 4, 'AI in healthcare', 'Analyze the impact of artificial intelligence in healthcare applications: key factors enabling AI success, specific applications, how AI addresses limitations in medical imaging and diagnosis, advances in computing infrastructure and future developments.',
      [['factor: data expansion / patient data', ['data']], ['factor: computing (GPU, cloud, HPC)', ['gpu', 'cloud', 'comput']], ['application: imaging / diagnosis', ['imag', 'diagnos', 'x-ray', 'mri', '\\bct\\b']], ['application: monitoring / personalized treatment / surgery', ['monitor', 'personal', 'surg', 'wearable', 'predict']], ['impact: cost / efficiency / accuracy', ['cost', 'efficien', 'accura', 'error']], ['future / challenges (privacy, interpretability…)', ['future', 'privacy', 'interpret', 'explain', 'trust']]],
      '<p><b>Factors (L1):</b> growing repositories of patient data (EHR, imaging) + advanced computing: HPC, cloud, GPUs, fast storage.</p><p><b>Applications:</b> diagnosis from X-ray / MRI / CT, AI polyp detection in colonoscopy (GI Genius, FDA approved, up to +14.4% adenoma detection), patient monitoring with wearables, outcome and disease-progression prediction for personalized treatment, image-guided surgery, telemedicine.</p><p><b>Limitations addressed:</b> overloaded, understaffed systems after COVID-19 → AI lowers costs, increases efficiency and accuracy, earlier diagnosis. <b>Future:</b> more data and hardware, generative models and digital twins; must be reliable, interpretable, privacy-aware.</p>'),
    O(true, C3, 4, 'CNN architecture', 'Explain the architecture and working principles of CNNs: key components (convolutional layers, activation functions, pooling layers, fully connected layers) and their role, a real-world example, and how CNNs differ from traditional fully connected networks.',
      [['convolutional layer: filters → feature maps', ['convolution', 'filter', 'kernel']], ['activation: ReLU, non-linearity', ['relu', 'non-linear', 'nonlinear', 'activation']], ['pooling: reduces spatial size (max)', ['pool']], ['fully connected layers → classification', ['fully connected', 'dense', '\\bfc\\b']], ['hierarchy: edges → objects', ['edge', 'hierarch', 'complex']], ['trained with backpropagation', ['backprop', 'train']], ['example: medical imaging / classification', ['medical', 'x-ray', 'mri', 'imagenet', 'detection', 'classification']], ['vs FC: weight sharing, fewer parameters', ['shar', 'fewer', 'parameter', 'efficien']]],
      '<p><b>Convolutional layers:</b> learned filters slide over the input and produce feature maps (local patterns, weight sharing). <b>Activation (ReLU):</b> non-linearity, avoids saturation. <b>Pooling</b> (max/sum): down-samples maps, invariance to small shifts. <b>Fully connected</b> layers at the end combine features into class scores. Trained by backpropagation.</p><p>Early layers detect edges, deeper layers parts and objects. Typical: CONV-ReLU-POOL repeated, then FC (LeNet, AlexNet, VGG, ResNet with skip connections).</p><p><b>Example:</b> CNN pre-trained on ImageNet fine-tuned on X-rays to detect tumours. <b>Vs FC:</b> FC connects every pixel to every neuron (3072 weights per neuron for 32×32×3) and loses spatial layout; a conv layer with ten 5×5×3 filters has 760 parameters → far more efficient on images.</p>',
      'The scanned answer called the first layer "conventional", chose sigmoid and mixed up pooling. Name each component and give its job.'),
    O(true, C3, 4, 'Preprocessing pipeline', 'Describe a comprehensive data preprocessing pipeline for a machine learning project. Include the major steps from raw data to model-ready data, explaining the purpose and methods for each step. Discuss how you would handle missing data, outliers, categorical variables, and feature scaling.',
      [['inspect / explore the data', ['inspect', 'explor', 'visuali', 'find the dirt', 'identify']], ['missing data: drop or impute (mean…)', ['missing']], ['outliers: IQR / Z-score, remove or cap', ['outlier']], ['duplicates / inconsistencies', ['duplicat', 'inconsist', 'redundan']], ['categorical: one-hot / label encoding', ['one-hot', 'one hot', 'label encod', 'encod']], ['scaling: min-max / z-score', ['scal', 'normaliz', 'standardi', 'min-max', 'z-score']], ['feature selection / reduction / imbalance', ['selection', 'pca', 'reduc', 'smote', 'imbalan']], ['split train / validation / test (no leakage)', ['split', 'leak', 'validation', 'test set']]],
      '<p><b>1 Inspect</b>: plots, impossible values, formats. <b>2 Missing data</b>: detect all forms (NaN, "", 0, placeholders), check if informative, drop rows / mostly-empty columns, or impute (mean, class mean, inference). <b>3 Noise and outliers</b>: binning; IQR (skewed) or Z-score |z|&gt;3 (normal), LOF, DBSCAN; remove, cap or segment. <b>4 Duplicates / inconsistencies</b>. <b>5 Categorical</b>: one-hot (nominal), label (ordinal), embeddings (high cardinality). <b>6 Scaling</b>: min-max or z-score, essential for KNN, K-means, gradient descent. <b>7 Reduce and balance</b>: feature selection / PCA, SMOTE. <b>8 Split</b> train/validation/test before fitting anything (no leakage).</p>',
      'The answer in the scan stopped after missing values. The question names four things: give each its own sentence.'),
    O(true, C3, 4, 'K-means vs hierarchical', 'Compare K-means clustering with hierarchical clustering methods: the fundamental algorithmic approaches and how they work, advantages and disadvantages of each, and how cluster evaluation methods (Silhouette Score, Elbow Method) apply to each approach. Provide specific examples.',
      [['K-means: init, assign, update, repeat', ['centroid', 'assign']], ['hierarchical: agglomerative merging closest clusters', ['agglomerat', 'merg', 'bottom']], ['dendrogram', ['dendrogram']], ['linkage (single / complete / average)', ['linkage', 'single', 'complete', 'average']], ['K-means needs k in advance; hierarchical does not', ['advance', 'number of cluster', 'k must', 'choose k']], ['K-means fast / scalable; hierarchical O(n²) slow', ['fast', 'scal', 'n²', 'n\\^2', 'slow', 'expensive']], ['elbow for K-means', ['elbow']], ['silhouette for both / cut the dendrogram', ['silhouette', 'cut']], ['examples', ['customer', 'segment', 'document', 'gene', 'taxonom', 'image']]],
      '<p><b>K-means</b> (partitional): choose k, init centroids, assign to nearest, update means, repeat. Fast O(tkn), scalable; but needs k, sensitive to initialization and outliers, assumes spherical clusters. Example: customer segmentation.</p><p><b>Hierarchical (agglomerative)</b>: every point starts alone; repeatedly merge the two closest clusters by a <b>linkage</b> (single, complete, average, centroid, Ward) → <b>dendrogram</b>. No k needed, shows structure at all levels, reveals outliers; but O(n²), slow on big data, cutting is subjective. Example: document topic hierarchies.</p><p><b>Evaluation:</b> elbow (SSD vs k) is natural for K-means; for hierarchical cut the dendrogram at the largest gap. <b>Silhouette</b> (and Davies-Bouldin) work for both: compute for each candidate k and take the best.</p>',
      'The scanned answer said hierarchical is "simple but less accurate" and K-means "slower". It is the other way round.'),
    /* practice */
    O(false, PR, 0, 'BGD vs SGD', 'Compare Batch Gradient Descent and Stochastic Gradient Descent in terms of convergence speed, stability, and suitability for large datasets.',
      [['BGD uses all samples', ['\\ball\\b', 'whole', 'entire']], ['SGD uses one sample / mini-batch', ['\\bone\\b', 'single', 'mini-batch', 'each sample']], ['BGD slow, stable / accurate', ['stable', 'smooth', 'accurate', 'slow']], ['SGD fast, noisy / oscillates', ['fast', 'noisy', 'oscillat']], ['SGD better for large datasets', ['large']]],
      '<p>BGD computes the gradient on all samples: precise and smooth but slow and memory-hungry, fine for small data. SGD uses one sample (or a mini-batch): fast, cheap, noisy and oscillating, suited to large data and data that does not fit in memory; its noise helps escape saddle points. Mini-batch is the compromise.</p>'),
    O(false, PR, 0, 'Activation functions', 'List and describe ReLU, sigmoid and tanh. How do activation functions influence backpropagation and learning complex patterns?',
      [['sigmoid 0..1', ['sigmoid']], ['tanh −1..1, zero-centered', ['tanh']], ['ReLU max(0, z)', ['relu']], ['saturation / vanishing gradients', ['saturat', 'vanish']], ['non-linearity needed for complex patterns', ['non-linear', 'nonlinear', 'complex']]],
      '<p>Sigmoid: 0..1, saturates → vanishing gradients. Tanh: −1..1, zero-centered, still saturates. ReLU: max(0, z), fast, gradient 1 for z &gt; 0 → less vanishing; dead neurons for z &lt; 0 (Leaky ReLU fixes). Without non-linear activations a deep network equals a linear model; the derivative f′(z) decides how much gradient flows back in backprop.</p>'),
    O(false, PR, 0, 'Validation and test sets', 'What is the purpose of a validation set? What is the role of a test set?',
      [['validation: tune hyperparameters / choose model', ['hyperparam', 'tune', 'tuning', 'select']], ['validation: detect overfitting / early stopping', ['overfit', 'early stop']], ['test: final evaluation', ['final']], ['test: unseen data, used once', ['unseen', 'once', 'never']]],
      '<p>Validation set: used during development to tune hyperparameters (λ, α, k, layers), compare models, detect overfitting and decide early stopping. Test set: used once at the end to estimate final performance on truly unseen data.</p>'),
    O(false, PR, 0, 'Standardization for distance methods', 'Why is it important to standardize features (e.g. Z-score) before applying distance-based algorithms like K-means or k-NN?',
      [['they use (Euclidean) distance', ['distance', 'euclid']], ['large-range features dominate', ['domina', 'range', 'scale', 'unit']], ['z = (x − μ)/σ → mean 0, std 1', ['mean 0', 'zero mean', 'standard deviation', 'std', 'μ', 'sigma', 'σ']], ['equal contribution', ['equal', 'fair', 'same']]],
      '<p>KNN and K-means compare points with Euclidean distance. A feature with a large range (income) dominates one with a small range (age). Z-score (x − μ)/σ gives each feature mean 0 and std 1 so all contribute equally; it also speeds up gradient descent.</p>'),
    O(false, PR, 0, 'Clustering evaluation metrics', 'When evaluating clustering quality, list and describe two quantitative metrics and one qualitative method.',
      [['silhouette (higher better)', ['silhouette']], ['Davies-Bouldin (lower better) or Dunn', ['davies', 'bouldin', 'dunn']], ['elbow / inertia', ['elbow', 'inertia']], ['visualization (qualitative)', ['visual', 'plot']], ['domain knowledge / expert', ['domain', 'expert']]],
      '<p>Quantitative: silhouette (−1..1, higher better), Davies-Bouldin (lower better), Dunn (higher better), inertia for the elbow. Qualitative: visualization (2D scatter after PCA, dendrogram) and domain knowledge (an expert judges if the groups make sense) — most useful when there is no ground truth.</p>'),
    O(false, PR, 0, 'Dimensionality reduction', 'What is dimensionality reduction? Mention one linear and one non-linear method. What is the role of PCA in clustering high-dimensional data?',
      [['fewer features, keep information', ['fewer', 'reduce', 'information']], ['linear: PCA', ['pca']], ['non-linear: t-SNE (or autoencoder)', ['t-sne', 'tsne', 'autoencoder']], ['curse of dimensionality / noise / visualization', ['curse', 'noise', 'visual']], ['drawback: information loss / interpretability', ['loss', 'interpret']]],
      '<p>Transforming the data into fewer features while keeping the most important information. Linear: PCA (LDA). Non-linear: t-SNE (autoencoders). For clustering, PCA removes noise and correlated features, fights the curse of dimensionality, speeds things up and allows 2D visualization; drawback: some information is lost and the new axes are hard to interpret.</p>'),
    O(false, PR, 0, 'Local minimum and convexity', 'What is a local minimum? Suggest one strategy to avoid it. Define a convex function and why convexity is important.',
      [['lower than neighbours, not the lowest overall', ['neighbo', 'not the lowest', 'not global', 'global']], ['strategy: momentum / random restarts / SGD', ['momentum', 'random', 'restart', 'initiali', 'sgd']], ['convex: segment between points not below the curve', ['segment', 'line', 'chord', 'between']], ['convex → local min = global min', ['global']]],
      '<p>A local minimum is lower than its neighbours but not the lowest overall; avoid with several random initializations, momentum or SGD noise. A function is convex if the segment between any two points of its curve is never below the curve. On a convex surface every local minimum is global, so gradient descent is guaranteed to find it.</p>')
  ];

  DM.SHEET = `
<table class="t"><tr><th>Topic</th><th>Formula / rule</th></tr>
<tr><td>Z-score</td><td><code>z = (x − μ)/σ</code>, outlier if |z| &gt; 3 (normal data)</td></tr>
<tr><td>IQR</td><td><code>IQR = Q3 − Q1</code>; outlier &lt; Q1 − 1.5·IQR or &gt; Q3 + 1.5·IQR (skewed data)</td></tr>
<tr><td>Min-max</td><td><code>(v − min)/(max − min)</code> → [0, 1]</td></tr>
<tr><td>Feature subsets</td><td><code>2^d</code> → stepwise selection / elimination</td></tr>
<tr><td>Linear regression</td><td><code>ŷ = θ0 + Σθ·x</code>, cost <code>J = (1/n)Σ(y − ŷ)²</code></td></tr>
<tr><td>Normal equation</td><td><code>θ = (XᵀX)⁻¹Xᵀy</code>, cost O(p³)</td></tr>
<tr><td>Gradient descent</td><td><code>θ := θ − α·∂J/∂θ</code> (simultaneous update)</td></tr>
<tr><td>Momentum</td><td><code>v = γv + α∇L,  w := w − v</code>, γ ≈ 0.9</td></tr>
<tr><td>L2 / Ridge</td><td><code>+ λΣw²</code> shrinks</td></tr>
<tr><td>L1 / Lasso</td><td><code>+ λΣ|w|</code> zeros (sparsity)</td></tr>
<tr><td>Elastic Net</td><td><code>λ1Σ|w| + λ2Σw²</code></td></tr>
<tr><td>Euclidean</td><td><code>√Σ(xi − yi)²</code></td></tr>
<tr><td>Hamming</td><td>number of positions that differ (binary strings)</td></tr>
<tr><td>Silhouette</td><td><code>s = (b − a)/max(a, b)</code>, −1..1, higher better</td></tr>
<tr><td>Davies-Bouldin</td><td>lower better · Dunn: higher better</td></tr>
<tr><td>K-means</td><td>Init → Assign → Update → Repeat, O(t·k·n)</td></tr>
<tr><td>Hierarchical</td><td>O(n²), dendrogram, single / complete / average / centroid linkage</td></tr>
<tr><td>Neuron</td><td><code>z = b + Σw·x,  h = f(z)</code></td></tr>
<tr><td>Activations</td><td>sigmoid 1/(1+e^−z) ∈ (0,1) · tanh ∈ (−1,1) · ReLU max(0,z) · Leaky max(0.01z, z)</td></tr>
<tr><td>Conv output</td><td><code>(N + 2P − F)/S + 1</code>; same size: P = (F−1)/2</td></tr>
<tr><td>Conv params</td><td><code>(F·F·depth + 1) × #filters</code>; #feature maps = #filters</td></tr>
<tr><td>PCA</td><td>center → covariance XᵀX → eigenvectors → keep top-k → X·Q</td></tr>
<tr><td>Hough line</td><td><code>ρ = x cosθ + y sinθ</code>, θ ∈ [0, π]; circle (a, b, r)</td></tr></table>
<h3>Exam traps</h3>
<table class="t"><tr><th>Trap</th><th>Correct</th></tr>
<tr><td>KNN's k vs k-fold CV's k</td><td>KNN k = neighbours; CV k = folds</td></tr>
<tr><td>Fill-ins checked word by word</td><td><b>max</b> · <b>filters</b> · <b>weights</b> · <b>vote</b> · <b>Euclidean</b> · <b>training</b> · <b>learning rate</b> · <b>frequency</b></td></tr>
<tr><td>Which is faster?</td><td>K-means fast O(tkn); hierarchical O(n²)</td></tr>
<tr><td>L1 vs L2 penalty</td><td>L1 absolute, L2 squared (an option swaps them)</td></tr>
<tr><td>Healthcare success factor</td><td>data + computing (GPUs, cloud), not "lower costs"</td></tr>
<tr><td>Feature extraction</td><td>loses interpretability (not "preserves")</td></tr>
<tr><td>More data helps when…</td><td>curves converging and still decreasing (not plateaued)</td></tr>
<tr><td>Overfitting</td><td>low train error + high test error = low bias, high variance</td></tr>
<tr><td>Open questions with listed sub-points</td><td>one sentence per sub-point, name it</td></tr></table>`;
})();
window.addEventListener('DOMContentLoaded', function(){ DM.start(); });
